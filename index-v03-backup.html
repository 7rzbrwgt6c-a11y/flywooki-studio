<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><meta name="description" content="Flywooki Studio – ewidencja magazynu filamentów 3D"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-512.png"><title>Flywooki Studio</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#171717;--muted:#737373;--line:#e5e5e5;--accent:#171717;--green:#15803d;--red:#b91c1c;--gold:#a16207}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{background:#080808;color:#fff;padding:14px max(18px,calc((100vw - 1240px)/2));display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;border-bottom:3px solid #292929}.brand{display:flex;align-items:center;gap:16px}.brand img{width:210px;max-width:42vw;height:auto;object-fit:contain}.brand small{display:block;color:#aaa;letter-spacing:.12em;text-transform:uppercase;font-size:10px;margin-top:3px}.head-actions{display:flex;gap:8px;flex-wrap:wrap}.wrap{max-width:1240px;margin:auto;padding:20px 18px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.tabs button{background:#e5e5e5;color:#262626}.tabs button.active{background:#111;color:#fff}button{border:0;border-radius:8px;padding:9px 13px;font-weight:650;cursor:pointer;background:#111;color:#fff}button.secondary{background:#ededed;color:#222}button.danger{background:#fee2e2;color:#991b1b}button:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:25px;font-weight:760;margin-top:5px;letter-spacing:-.03em}.panel{margin-top:15px}.panel h2{font-size:16px;margin:0 0 12px}.split{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}tr:last-child td{border-bottom:0}.pill{padding:3px 8px;border-radius:20px;font-size:11px;background:#eee;white-space:nowrap}.pill.open{background:#dcfce7;color:#166534}.pill.closed{background:#e5e5e5;color:#525252}.pill.low{background:#fef3c7;color:#92400e}.empty{padding:26px;text-align:center;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}input,select,textarea{width:100%;padding:9px 10px;border:1px solid #d4d4d4;border-radius:8px;background:white;color:var(--ink);font:inherit}label{font-size:12px;color:#525252;font-weight:650;display:block;margin-bottom:4px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}.dialog{background:white;border-radius:14px;padding:18px;max-width:850px;width:100%;max-height:92vh;overflow:auto}.dialog h2{margin:0 0 14px;font-size:18px}.dialog footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice{background:#f5f5f5;color:#404040;padding:10px;border-radius:8px;font-size:12px;margin:10px 0}.footer{color:#777;font-size:11px;padding:20px 0;text-align:center}.hide{display:none}.search{max-width:340px}.subtle{color:var(--muted);font-size:12px}.line-items{min-width:760px}.line-items input,.line-items select{min-width:90px}.line-items td{padding:6px}.line-items th{padding:7px}.tag{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:.08em}.brandline{height:1px;background:#ddd;margin:12px 0}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){header{padding:12px}.brand img{width:175px}.head-actions{width:100%}.head-actions button{flex:1}.wrap{padding:14px 10px}.grid{gap:8px}.metric{padding:11px}.metric .value{font-size:20px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.tabs{display:grid;grid-template-columns:repeat(3,1fr)}.tabs button{padding:9px 5px;font-size:12px}.panel{padding:12px}}

 body{font-size:15px;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}

 .head-actions{display:grid;grid-template-columns:1fr 1fr;width:100%}.head-actions button{min-height:44px}

 .search{max-width:none;width:100%}.filters{display:grid;grid-template-columns:1fr}
}
@media(max-width:380px){.brand img{width:62vw}.grid{gap:7px}.metric{padding:9px}.tabs button{font-size:12px}.metric .value{font-size:18px}}

/* Flywooki Studio Dark Orange theme */
:root{--bg:#0b0d10;--card:#15191e;--ink:#f2f4f6;--muted:#9ba4ad;--line:#2a3037;--accent:#ff7900;--green:#42c878;--red:#ff6262;--gold:#ffb020;color-scheme:dark}
body{background:var(--bg);color:var(--ink)}header{background:#050607;border-bottom:3px solid #ff7900} .tabs button{background:#20262d;color:#d9dfe5}.tabs button.active{background:#ff7900;color:#101010}
button{background:#ff7900;color:#111}button.secondary{background:#252c33;color:#f2f4f6;border:1px solid #353e47}button.danger{background:#532626;color:#ffdada}button:disabled{opacity:.45}
.metric,.panel{background:var(--card);border-color:var(--line)}th,td{border-bottom-color:var(--line)}th,label,.tag{color:var(--muted)}input,select,textarea{background:#0f1317;color:var(--ink);border-color:#343c44}input::placeholder,textarea::placeholder{color:#78828b} .dialog{background:#15191e;color:var(--ink);border:1px solid #343c44}.dialog footer{background:#15191e}.notice{background:#20262d;color:#dce2e8}.empty{color:var(--muted)}.pill{background:#252c33;color:#e5e9ed}.pill.open{background:#163d2a;color:#9ce5b9}.pill.closed{background:#252c33;color:#c0c6cc}.pill.low{background:#493716;color:#ffd27b}.brandline{background:#343c44}.footer{color:var(--muted)}

</style></head><body>
<header><div class="brand"><img src="logo-flywooki.png" alt="Flywooki Studio"><div><small>Filament management · v0.3 PWA</small></div></div><div class="head-actions"><button class="secondary" id="exportBtn">Eksport kopii</button><button class="secondary" id="importBtn">Import kopii</button><button class="secondary" id="installHelpBtn">Instalacja PWA</button><input id="fileInput" type="file" accept="application/json" class="hide"></div></header>
<div class="wrap"><nav class="tabs"><button class="active" data-tab="dashboard">Dashboard</button><button data-tab="spools">Szpule</button><button data-tab="invoices">Faktury</button><button data-tab="sales">Rozchód zewn.</button><button data-tab="catalog">Katalog</button><button data-tab="history">Historia</button></nav><main id="app"></main><div class="footer">FLYWOOKI STUDIO · PROTOTYP 0.2 · Dane pozostają lokalnie w tej przeglądarce. To nie jest jeszcze synchronizowana baza online.</div></div><div id="modalRoot"></div>
<script>
(()=>{
const KEY='flywooki-studio-v02',OLD='filamentstock-v01';let data=load(),tab='dashboard',filter='';
function blank(){return{spools:[],history:[],suppliers:[],invoices:[],sales:[]}}
function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v)return Object.assign(blank(),v);let old=JSON.parse(localStorage.getItem(OLD));if(old){let migrated=Object.assign(blank(),old);localStorage.setItem(KEY,JSON.stringify(migrated));return migrated}}catch(e){}return blank()}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function fmt(n){return Number(n||0).toLocaleString('pl-PL',{maximumFractionDigits:2})}function money(n){return Number(n||0).toLocaleString('pl-PL',{style:'currency',currency:'PLN'})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateNow(){return new Date().toISOString().slice(0,10)}function totalKg(){return data.spools.reduce((a,s)=>a+Math.max(0,+s.remaining)/1000,0)}function totalValue(){return data.spools.reduce((a,s)=>a+(Math.max(0,+s.remaining)/Math.max(1,+s.initial))*(+s.cost||0),0)}function revenue(){return data.sales.reduce((a,s)=>a+(+s.revenue||0),0)}function addHistory(action,spool,qty,note='',extra={}){data.history.unshift({id:crypto.randomUUID(),date:new Date().toISOString(),action,spoolName:spool?.name||'—',qty,note,...extra})}
function nav(){document.querySelectorAll('.tabs button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.onclick=()=>{tab=b.dataset.tab;render()}})}function render(){nav();let root=document.getElementById('app');root.innerHTML=({dashboard,spools,invoices,sales,catalog,history}[tab]||dashboard)();wire()}
function dashboard(){let low=data.spools.filter(s=>s.remaining<=s.lowThreshold&&s.remaining>0),empty=data.spools.filter(s=>s.remaining<=0);return `<div class="grid"><div class="metric"><div class="label">Stan magazynu</div><div class="value">${fmt(totalKg())} kg</div></div><div class="metric"><div class="label">Wartość pozostałego towaru</div><div class="value">${money(totalValue())}</div></div><div class="metric"><div class="label">Szpule w ewidencji</div><div class="value">${data.spools.length}</div></div><div class="metric"><div class="label">Przychód ze sprzedaży</div><div class="value">${money(revenue())}</div></div></div><section class="panel"><div class="split"><h2>Alerty magazynowe</h2><button id="addSpool">+ Dodaj szpulę</button></div>${low.length||empty.length?`<ul>${low.map(s=>`<li><b>${esc(s.name)}</b> – ${fmt(s.remaining)} g (próg ${fmt(s.lowThreshold)} g)</li>`).join('')}${empty.map(s=>`<li><b>${esc(s.name)}</b> – <span style="color:var(--red)">szpula pusta</span></li>`).join('')}</ul>`:`<div class="empty">Brak alertów magazynowych.</div>`}</section><section class="panel"><div class="split"><h2>Ostatnie operacje</h2><div class="actions"><button class="secondary" id="goInvoices">Faktury</button><button class="secondary" id="goSales">Rozchód zewnętrzny</button></div></div>${data.history.length?historyTable(data.history.slice(0,6)):`<div class="empty">Brak operacji.</div>`}</section><section class="panel"><h2>Ważne informacje o wersji 0.2</h2><p class="subtle">Faktura przyjęta do magazynu tworzy osobne rekordy szpul. Rozchód zewnętrzny zmniejsza stan konkretnej szpuli i zapisuje przychód oddzielnie od kosztu materiału. Cena sprzedaży katalogowej nie jest automatycznie zmieniana przez kolejne faktury.</p></section>`}
function spoolTable(arr){return `<div class="table-wrap"><table><thead><tr><th>Szpula</th><th>Materiał / kolor</th><th>Stan</th><th>Koszt zakupu</th><th>Status</th><th>Operacje</th></tr></thead><tbody>${arr.map(s=>`<tr><td><b>${esc(s.name)}</b><br><small>${esc(s.brand)} · ${esc(s.location||'')}</small></td><td>${esc(s.material)} · ${esc(s.color)}</td><td>${fmt(s.remaining)} / ${fmt(s.initial)} g</td><td>${money(s.cost)}</td><td><span class="pill ${s.remaining<=0?'closed':s.remaining<=s.lowThreshold?'low':'open'}">${s.remaining<=0?'Pusta':s.remaining<=s.lowThreshold?'Niski stan':s.open?'Otwarta':'Zamknięta'}</span></td><td><div class="actions"><button data-consume="${s.id}" ${s.remaining<=0?'disabled':''}>Zużycie</button><button class="secondary" data-edit="${s.id}">Korekta</button></div></td></tr>`).join('')}</tbody></table></div>`}
function spools(){let arr=data.spools.filter(s=>(s.name+' '+s.brand+' '+s.material+' '+s.color+' '+s.location).toLowerCase().includes(filter.toLowerCase()));return `<section class="panel"><div class="split"><h2>Fizyczne szpule</h2><button id="addSpool">+ Dodaj szpulę</button></div><div class="filters"><input class="search" id="searchSpools" placeholder="Szukaj: nazwa, materiał, kolor…" value="${esc(filter)}"></div>${arr.length?spoolTable(arr):`<div class="empty">Brak pasujących szpul.</div>`}</section>`}
function invoices(){return `<section class="panel"><div class="split"><div><h2>Rejestr faktur zakupowych</h2><div class="subtle">Dokumenty, dostawcy i przyjęcia magazynowe</div></div><button id="addInvoice">+ Dodaj fakturę</button></div>${data.invoices.length?`<div class="table-wrap"><table><thead><tr><th>Dokument</th><th>Dostawca</th><th>Daty</th><th>Pozycje</th><th>Netto / brutto</th><th>Status</th><th>Plik</th></tr></thead><tbody>${data.invoices.slice().reverse().map(i=>`<tr><td><b>${esc(i.number)}</b></td><td>${esc(i.supplierName)}<br><small>NIP: ${esc(i.nip||'—')}</small></td><td>Wystaw.: ${esc(i.issueDate)}<br>Zakup: ${esc(i.purchaseDate)}</td><td>${i.items.length} pozycji<br><small>${i.items.reduce((a,x)=>a+(+x.qty||0),0)} szpul</small></td><td>${money(i.netTotal)}<br><b>${money(i.grossTotal)}</b></td><td><span class="pill open">Przyjęto</span></td><td>${i.fileName?`<span title="${esc(i.fileName)}">${esc(i.fileName.slice(0,22))}</span>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nie dodano jeszcze faktur zakupowych.</div>`}</section><section class="panel"><h2>Dostawcy (${data.suppliers.length})</h2>${data.suppliers.length?`<div class="table-wrap"><table><thead><tr><th>Firma</th><th>NIP</th><th>Adres</th><th>Zakupy</th></tr></thead><tbody>${data.suppliers.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.nip)}</td><td>${esc(s.address||'—')}</td><td>${data.invoices.filter(i=>i.nip===s.nip).length}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Dostawcy zostaną dodani przy rejestracji faktur.</div>`}</section>`}
function sales(){return `<section class="panel"><div class="split"><div><h2>Rozchód zewnętrzny / sprzedaż</h2><div class="subtle">Sprzedaż zmniejsza stan magazynowy i zapisuje przychód.</div></div><button id="addSale" ${data.spools.filter(s=>s.remaining>0).length?'':'disabled'}>+ Zarejestruj sprzedaż</button></div><div class="grid" style="grid-template-columns:repeat(3,1fr);margin:12px 0"><div class="metric"><div class="label">Przychód łącznie</div><div class="value">${money(revenue())}</div></div><div class="metric"><div class="label">Transakcje</div><div class="value">${data.sales.length}</div></div><div class="metric"><div class="label">Sprzedany materiał</div><div class="value">${fmt(data.sales.reduce((a,s)=>a+(+s.qty||0),0))} g</div></div></div>${data.sales.length?`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Dokument</th><th>Klient</th><th>Szpula / materiał</th><th>Ilość</th><th>Cena / kg</th><th>Przychód</th></tr></thead><tbody>${data.sales.slice().reverse().map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(s.document||'—')}</td><td>${esc(s.customer||'—')}</td><td>${esc(s.spoolName)}</td><td>${fmt(s.qty)} g</td><td>${money(s.pricePerKg)}</td><td><b>${money(s.revenue)}</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Brak zarejestrowanej sprzedaży.</div>`}</section><div class="notice">Przychód nie jest zyskiem. Koszt sprzedanego filamentu i marża są ewidencjonowane oddzielnie – w tej wersji nie uwzględniamy jeszcze kosztów dodatkowych.</div>`}
function catalog(){let g={};data.spools.forEach(s=>{let k=[s.brand,s.material,s.color].join('|');if(!g[k])g[k]={brand:s.brand,material:s.material,color:s.color,count:0,grams:0,value:0};g[k].count++;g[k].grams+=+s.remaining;g[k].value+=(+s.remaining/Math.max(1,+s.initial))*(+s.cost||0)});let rows=Object.values(g);return `<section class="panel"><h2>Katalog materiałów</h2><p class="subtle">Widok zbiorczy na podstawie fizycznych szpul. Cena sprzedaży katalogowej nie jest nadpisywana przy przyjęciu faktury.</p>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Producent</th><th>Materiał</th><th>Kolor</th><th>Szpule</th><th>Stan</th><th>Wartość pozostała</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.brand)}</td><td>${esc(r.material)}</td><td>${esc(r.color)}</td><td>${r.count}</td><td>${fmt(r.grams)} g</td><td>${money(r.value)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Brak danych katalogowych.</div>`}</section>`}
function historyTable(rows){return `<div class="table-wrap"><table><thead><tr><th>Data</th><th>Operacja</th><th>Szpula</th><th>Ilość</th><th>Szczegóły</th></tr></thead><tbody>${rows.map(h=>`<tr><td>${new Date(h.date).toLocaleString('pl-PL')}</td><td>${esc(h.action)}</td><td>${esc(h.spoolName)}</td><td>${h.qty==null?'—':fmt(h.qty)+' g'}</td><td>${esc(h.note||'')}</td></tr>`).join('')}</tbody></table></div>`}function history(){return `<section class="panel"><h2>Historia operacji</h2>${data.history.length?historyTable(data.history):`<div class="empty">Historia jest pusta.</div>`}</section>`}
function modal(title,body,onSave,wide=false){document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="dialog" style="${wide?'max-width:1000px':''}"><h2>${title}</h2>${body}<footer><button class="secondary" id="cancelModal">Anuluj</button><button id="saveModal">Zapisz</button></footer></div></div>`;document.getElementById('cancelModal').onclick=closeModal;document.getElementById('saveModal').onclick=onSave}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function spoolForm(){modal('Dodaj szpulę',`<form id="spoolForm"><div class="formgrid"><div><label>Nazwa / identyfikator *</label><input name="name" required placeholder="np. PLA Black – 01"></div><div><label>Producent</label><input name="brand" placeholder="np. Smart Print"></div><div><label>Materiał *</label><select name="material">${['PLA','PLA+','PETG','ABS','ASA','TPU','PC','PA','PLA Silk','PLA CF','PETG CF','Inny'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Kolor</label><input name="color" placeholder="Black"></div><div><label>Masa początkowa (g) *</label><input name="initial" type="number" min="1" value="1000" required></div><div><label>Masa aktualna (g)</label><input name="remaining" type="number" min="0" value="1000"></div><div><label>Koszt zakupu (PLN)</label><input name="cost" type="number" min="0" step="0.01" value="0"></div><div><label>Próg alertu (g)</label><input name="low" type="number" min="0" value="150"></div><div><label>Lokalizacja</label><input name="location"></div><div><label>Status</label><select name="open"><option value="false">Fabrycznie zamknięta</option><option value="true">Otwarta</option></select></div></div></form>`,()=>{let f=document.getElementById('spoolForm');if(!f.reportValidity())return;let x=new FormData(f),initial=+x.get('initial'),remaining=+x.get('remaining');if(remaining>initial)return alert('Masa aktualna nie może przekraczać początkowej.');let s={id:crypto.randomUUID(),created:Date.now(),name:x.get('name'),brand:x.get('brand')||'Nieznany',material:x.get('material'),color:x.get('color')||'Nie określono',initial,remaining,cost:+x.get('cost')||0,lowThreshold:+x.get('low')||0,location:x.get('location'),open:x.get('open')==='true'};data.spools.push(s);addHistory('Przyjęcie ręczne',s,initial,'Ręczne dodanie szpuli');closeModal();save()})}
function consumeForm(id){let s=data.spools.find(x=>x.id===id);if(!s)return;modal('Rozchód wewnętrzny',`<form id="consumeForm"><div class="notice">${esc(s.name)} · dostępne ${fmt(s.remaining)} g</div><div class="formgrid"><div><label>Zużycie (g) *</label><input name="qty" type="number" min="1" max="${s.remaining}" required></div><div><label>Projekt / powód</label><input name="note" placeholder="np. prototyp / test materiału"></div></div></form>`,()=>{let f=document.getElementById('consumeForm');if(!f.reportValidity())return;let x=new FormData(f),q=+x.get('qty');if(q>s.remaining)return alert('Brak wystarczającej ilości.');s.remaining-=q;addHistory('Zużycie wewnętrzne',s,q,x.get('note'));closeModal();save()})}
function editSpool(id){let s=data.spools.find(x=>x.id===id);if(!s)return;modal('Korekta masy szpuli',`<form id="editForm"><div class="formgrid"><div><label>Nowa masa (g)</label><input name="remaining" type="number" min="0" max="${s.initial}" value="${s.remaining}" required></div><div><label>Lokalizacja</label><input name="location" value="${esc(s.location)}"></div><div><label>Status</label><select name="open"><option value="true" ${s.open?'selected':''}>Otwarta</option><option value="false" ${!s.open?'selected':''}>Zamknięta</option></select></div></div></form>`,()=>{let f=document.getElementById('editForm');if(!f.reportValidity())return;let x=new FormData(f),prev=s.remaining;s.remaining=+x.get('remaining');s.location=x.get('location');s.open=x.get('open')==='true';addHistory('Korekta stanu',s,s.remaining-prev,'Ręczna aktualizacja masy');closeModal();save()})}
function invoiceForm(){let row=()=>`<tr><td><input name="pname" placeholder="PLA Basic Black" required></td><td><input name="cn" placeholder="3916…"></td><td><input name="material" value="PLA"></td><td><input name="color" placeholder="Black"></td><td><input name="qty" type="number" min="1" value="1" required></td><td><input name="weight" type="number" min="1" value="1000" required></td><td><input name="net" type="number" min="0" step="0.01" value="0"></td><td><input name="gross" type="number" min="0" step="0.01" value="0"></td><td><input name="retail" type="number" min="0" step="0.01" value="0"></td><td><button type="button" class="danger removeRow">×</button></td></tr>`;
let body=`<form id="invoiceForm"><div class="formgrid"><div><label>Dostawca / firma *</label><input name="supplier" required></div><div><label>NIP</label><input name="nip" placeholder="10 cyfr"></div><div class="field full"><label>Adres dostawcy</label><input name="address"></div><div><label>Numer faktury *</label><input name="number" required></div><div><label>Kraj</label><input name="country" value="Polska"></div><div><label>Data wystawienia</label><input name="issue" type="date" value="${dateNow()}"></div><div><label>Data zakupu / dostawy</label><input name="purchase" type="date" value="${dateNow()}"></div><div><label>Termin płatności</label><input name="due" type="date"></div><div><label>Metoda płatności</label><select name="payment"><option>Przelew</option><option>Karta</option><option>Gotówka</option><option>Inna</option></select></div><div><label>Status płatności</label><select name="paid"><option>Nieopłacona</option><option>Częściowo opłacona</option><option>Opłacona</option></select></div><div><label>Koszt dostawy brutto (PLN)</label><input name="shipping" type="number" min="0" step="0.01" value="0"></div><div class="field full"><label>Załącz fakturę (PDF / JPG / PNG, max. 1,5 MB)</label><input name="file" type="file" accept=".pdf,image/png,image/jpeg"></div></div><div class="brandline"></div><div class="split"><h3>Pozycje faktury</h3><button type="button" class="secondary" id="addLine">+ Dodaj pozycję</button></div><div class="table-wrap"><table class="line-items"><thead><tr><th>Nazwa produktu</th><th>Kod CN</th><th>Materiał</th><th>Kolor</th><th>Ilość</th><th>g/szp.</th><th>Netto/szt.</th><th>Brutto/szt.</th><th>Cena detaliczna/szt.</th><th></th></tr></thead><tbody id="invoiceRows">${row()}</tbody></table></div><div class="notice">Każda jednostka ilości utworzy osobną szpulę w magazynie. Koszt zakupu przypisany do szpuli to cena brutto za sztukę. Cena detaliczna jest zapisywana w danych pozycji, ale nie nadpisuje automatycznie cen sprzedaży istniejących produktów.</div><div><label>Uwagi</label><textarea name="notes" rows="2"></textarea></div></form>`;
modal('Nowa faktura zakupowa',body,async()=>{let f=document.getElementById('invoiceForm');if(!f.reportValidity())return;let x=new FormData(f),names=[...f.querySelectorAll('[name=pname]')],rows=[...document.querySelectorAll('#invoiceRows tr')].map(tr=>{let v=n=>tr.querySelector(`[name=${n}]`).value;return{name:v('pname'),cn:v('cn'),material:v('material'),color:v('color'),qty:+v('qty'),weight:+v('weight'),net:+v('net'),gross:+v('gross'),retail:+v('retail')}});if(!rows.length||rows.some(r=>!r.name||r.qty<1||r.weight<1))return alert('Uzupełnij prawidłowo pozycje faktury.');let file=f.elements.file.files[0],fileData=null;if(file){if(file.size>1.5*1024*1024)return alert('Załącznik jest większy niż 1,5 MB. Zmniejsz plik lub pomiń załącznik.');fileData=await new Promise((resolve,reject)=>{let rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(file)})}let supplierName=x.get('supplier').trim(),nip=x.get('nip').trim(),supplier=data.suppliers.find(s=>nip&&s.nip===nip);if(!supplier){supplier={id:crypto.randomUUID(),name:supplierName,nip,address:x.get('address'),country:x.get('country')};data.suppliers.push(supplier)}else{supplier.name=supplierName;supplier.address=x.get('address');supplier.country=x.get('country')}
let inv={id:crypto.randomUUID(),supplierName,nip,address:x.get('address'),number:x.get('number'),issueDate:x.get('issue'),purchaseDate:x.get('purchase'),dueDate:x.get('due'),payment:x.get('payment'),paid:x.get('paid'),shipping:+x.get('shipping')||0,notes:x.get('notes'),items:rows,fileName:file?.name||'',fileData,netTotal:rows.reduce((a,r)=>a+r.net*r.qty,0),grossTotal:rows.reduce((a,r)=>a+r.gross*r.qty,0)+(+x.get('shipping')||0),created:new Date().toISOString()};data.invoices.push(inv);rows.forEach(r=>{for(let n=0;n<r.qty;n++){let s={id:crypto.randomUUID(),created:Date.now(),name:`${r.name} · ${String(n+1).padStart(2,'0')}`,brand:supplierName,material:r.material,color:r.color||'Nie określono',initial:r.weight,remaining:r.weight,cost:r.gross,netCost:r.net,cn:r.cn,retailPrice:r.retail,lowThreshold:150,location:'',open:false,invoiceId:inv.id};data.spools.push(s);addHistory('Przyjęcie z faktury',s,r.weight,`${inv.number} · ${supplierName}`)}});closeModal();save();alert('Faktura zapisana, szpule przyjęte na stan.')},true);
document.getElementById('addLine').onclick=()=>document.getElementById('invoiceRows').insertAdjacentHTML('beforeend',row());document.getElementById('invoiceRows').onclick=e=>{if(e.target.classList.contains('removeRow')){if(document.querySelectorAll('#invoiceRows tr').length>1)e.target.closest('tr').remove();else alert('Faktura musi mieć przynajmniej jedną pozycję.')}}}
function saleForm(){let available=data.spools.filter(s=>s.remaining>0);let opts=available.map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.material)} ${esc(s.color)} · ${fmt(s.remaining)} g</option>`).join('');modal('Rejestruj rozchód zewnętrzny',`<form id="saleForm"><div class="formgrid"><div class="field full"><label>Szpula / produkt *</label><select name="spool" required>${opts}</select></div><div><label>Ilość sprzedana (g) *</label><input name="qty" type="number" min="1" required></div><div><label>Cena sprzedaży (PLN / kg) *</label><input name="price" type="number" min="0" step="0.01" value="0" required></div><div><label>Data sprzedaży</label><input name="date" type="date" value="${dateNow()}"></div><div><label>Numer dokumentu</label><input name="doc" placeholder="FV / paragon / WZ"></div><div><label>Klient</label><input name="customer"></div><div><label>Uwagi</label><input name="note"></div></div><div class="notice" id="salePreview">Wybierz szpulę i podaj ilość oraz cenę, aby obliczyć przychód.</div></form>`,()=>{let f=document.getElementById('saleForm');if(!f.reportValidity())return;let x=new FormData(f),s=data.spools.find(a=>a.id===x.get('spool')),q=+x.get('qty'),price=+x.get('price');if(!s||q>s.remaining)return alert('Ilość przekracza dostępny stan szpuli.');let rev=q/1000*price;s.remaining-=q;let sale={id:crypto.randomUUID(),spoolId:s.id,spoolName:s.name,qty:q,pricePerKg:price,revenue:rev,date:x.get('date'),document:x.get('doc'),customer:x.get('customer'),note:x.get('note'),costAtSale:(s.cost/Math.max(1,s.initial))*q};data.sales.push(sale);addHistory('Rozchód zewnętrzny',s,q,`${sale.document||'Sprzedaż'} · ${sale.customer||'klient niepodany'} · przychód ${money(rev)}`);closeModal();save()});let update=()=>{let f=document.getElementById('saleForm'),s=data.spools.find(a=>a.id===f.elements.spool.value),q=+f.elements.qty.value||0,p=+f.elements.price.value||0;document.getElementById('salePreview').textContent=s?`Dostępne: ${fmt(s.remaining)} g · Przychód z tej sprzedaży: ${money(q/1000*p)} · Szacunkowy koszt materiału: ${money((s.cost/Math.max(1,s.initial))*q)}`:''};document.getElementById('saleForm').oninput=update;document.getElementById('saleForm').onchange=update;update()}
function wire(){document.getElementById('addSpool')?.addEventListener('click',spoolForm);document.getElementById('addInvoice')?.addEventListener('click',invoiceForm);document.getElementById('addSale')?.addEventListener('click',saleForm);document.getElementById('goInvoices')?.addEventListener('click',()=>{tab='invoices';render()});document.getElementById('goSales')?.addEventListener('click',()=>{tab='sales';render()});let search=document.getElementById('searchSpools');if(search)search.oninput=e=>{filter=e.target.value;let p=e.target.selectionStart;render();let n=document.getElementById('searchSpools');n.focus();n.setSelectionRange(p,p)};document.querySelectorAll('[data-consume]').forEach(b=>b.onclick=()=>consumeForm(b.dataset.consume));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editSpool(b.dataset.edit))}
function wireExport(){document.getElementById('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({version:2,app:'Flywooki Studio',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='flywooki-studio-backup-'+dateNow()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();document.getElementById('fileInput').onchange=e=>{let file=e.target.files[0];if(!file)return;let rd=new FileReader();rd.onload=()=>{try{let v=JSON.parse(rd.result),d=v.data||v;if(!Array.isArray(d.spools)||!Array.isArray(d.history))throw Error('Nieprawidłowy format');if(confirm('Import zastąpi aktualne dane tej przeglądarki. Kontynuować?')){data=Object.assign(blank(),d);save();alert('Kopia została zaimportowana.')}}catch(err){alert('Import nieudany: '+err.message)}};rd.readAsText(file);e.target.value=''}};
wireExport();render();document.getElementById('installHelpBtn').onclick=()=>alert('Instalacja na iPhone/iPad: otwórz Flywooki Studio w Safari, wybierz Udostępnij, następnie Dodaj do ekranu początkowego. Instalacja wymaga adresu HTTPS.');if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}if('serviceWorker' in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
