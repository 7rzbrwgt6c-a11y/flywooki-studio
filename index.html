<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b"><meta name="description" content="Flywooki Studio - magazyn filamentów">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-512.png">
<title>Flywooki Studio</title>
<style>
:root{--bg:#090a0c;--card:#15191e;--ink:#f2f4f7;--muted:#9aa6b2;--line:#2b333c;--accent:#ff7900;--red:#d94b52;--green:#52b788}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 22px;border-bottom:3px solid var(--accent);background:#050506;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:22px}.brand img{width:160px;max-width:40vw}.brand small{letter-spacing:2px;color:#b7c0c8;font-size:10px}.head-actions,.actions{display:flex;gap:8px;flex-wrap:wrap}
.wrap{max-width:1400px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{background:#20262d;color:var(--ink);border:0}.tabs button.active{background:var(--accent);color:#111}
button{background:var(--accent);color:#111;border:0;padding:10px 14px;border-radius:9px;font-weight:700;cursor:pointer}button.secondary{background:#252d35;color:var(--ink);border:1px solid #35414d}button.danger{background:#9b3339;color:white}button:disabled{opacity:.45;cursor:not-allowed}
.panel,.metric{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:23px;font-weight:800;margin-top:5px}.split{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px}.subtle,.small{color:var(--muted)}.empty{text-align:center;padding:30px;color:var(--muted)}.notice{background:#252a31;padding:12px;border-radius:9px;margin:12px 0;color:#cbd4dd}
input,select,textarea{width:100%;background:#0e1115;color:var(--ink);border:1px solid #39434e;border-radius:8px;padding:10px;margin:5px 0 12px;font:inherit}label{display:block;color:#c2cbd3;font-size:12px}.filters{margin:10px 0}.search{max-width:450px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:#aeb9c4;font-size:12px}td small{color:var(--muted)}.productPhoto{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;margin:0 0 6px}.photoPreview{max-width:120px;max-height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;margin:8px 0}.pill{padding:4px 8px;border-radius:20px;font-size:11px;background:#303840}.pill.low{background:#654b1e}.pill.closed{background:#543036}.pill.open{background:#244536}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.field.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.dialog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:1100px;max-height:94vh;overflow:auto}.dialog footer{display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:-18px;background:var(--card);padding:14px 0 0}.footer{text-align:center;color:var(--muted);font-size:11px;padding:18px}.hide{display:none}.syncDock{position:fixed;right:18px;bottom:14px;z-index:12;font-size:12px}.syncDock button{padding:7px 10px;font-size:12px}.syncDetails{display:none;width:min(360px,calc(100vw - 30px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 8px 28px #0008}.syncDetails.show{display:block}.syncDetails p{margin:6px 0;color:var(--muted);overflow-wrap:anywhere}.syncDock .syncToggle{background:#20262d;color:var(--muted);border:1px solid var(--line);border-radius:20px}
@media(max-width:700px){header{padding:12px}.wrap{padding:12px}.brand{gap:10px}.brand img{width:125px}.formgrid{grid-template-columns:1fr}.metric .value{font-size:20px}.tabs button{padding:9px 11px}.head-actions button{padding:9px 10px}}
</style>
</head>
<body>
<header><div class="brand"><img src="logo-flywooki.png" alt="Flywooki Studio"><div><small>FILAMENT MANAGEMENT · 0.6.0 TEST</small></div></div><div class="head-actions"><button class="secondary" id="supabaseBtn">Logowanie / Supabase</button><button class="secondary" id="exportBtn">Eksport kopii</button><button class="secondary" id="importBtn">Import kopii</button><button class="secondary" id="installHelpBtn">Instalacja PWA</button><input id="fileInput" type="file" accept="application/json" class="hide"></div></header>
<div class="wrap"><nav class="tabs"><button class="active" data-tab="dashboard">Dashboard</button><button data-tab="inventory">Magazyn</button><button data-tab="invoices">Zakupy</button><button data-tab="sales">Sprzedaż / rozchód</button><button data-tab="catalog">Katalog</button><button data-tab="history">Historia</button></nav><main id="app"></main><div class="footer">FLYWOOKI STUDIO · 0.5.5 · Przygotowanie synchronizacji. Dane nadal lokalne — synchronizacja nie jest jeszcze aktywna.</div></div><div id="modalRoot"></div>
<div id="sbPanel" class="modal hide"><div class="dialog" style="max-width:520px"><h2>FSM 0.6 · Logowanie do chmury</h2><p class="small">Test logowania przez GitHub i weryfikacja dostępu do schemy fsm.</p><label>Project URL</label><input id="sbUrl" placeholder="https://....supabase.co"><label>Publishable key</label><input id="sbKey" placeholder="sb_publishable_..." autocomplete="off"><div class="actions"><button id="sbGithub">Zaloguj przez GitHub</button><button class="secondary" id="sbClose">Zamknij</button></div><div id="sbResult" class="notice">Nie wykonano logowania.</div></div></div>
<script>
(()=>{
const KEY='flywooki-studio-v04',OLD='flywooki-studio-v02',LEGACY='filamentstock-v01',DEVICE_KEY='fsm-device-id';
let deviceId=localStorage.getItem(DEVICE_KEY);if(!deviceId){deviceId=crypto.randomUUID();localStorage.setItem(DEVICE_KEY,deviceId)}
let data=load(),tab='dashboard',filter='';
function blank(){return{schemaVersion:5,sync:{deviceId,revision:0,lastLocalChange:null,lastSync:null,status:'local-only'},products:[],categories:['PLA','PLA+','PETG','ABS','ASA','TPU','PC','PA','PLA Silk','PLA CF','PETG CF','Inny'],history:[],suppliers:[],invoices:[],sales:[]}}
function ensureMeta(d){d.schemaVersion=5;d.sync=Object.assign({deviceId,revision:0,lastLocalChange:null,lastSync:null,status:'local-only'},d.sync||{});d.sync.deviceId=deviceId;return d}
function migrateLegacy(old){let d=blank();d.history=old.history||[];d.suppliers=old.suppliers||[];d.invoices=old.invoices||[];d.sales=(old.sales||[]).map(s=>({...s,productCN:s.cn||s.productCN||''}));let groups=new Map();(old.spools||[]).forEach(s=>{let cn=String(s.cn||'').trim();let key=cn?('CN:'+cn):[s.brand,s.material,s.color,s.name.replace(/ · \\d+$/,'')].join('|');let p=groups.get(key);if(!p){p={id:crypto.randomUUID(),cnId:cn||('LEGACY-'+Math.random().toString(36).slice(2,8).toUpperCase()),name:s.name.replace(/ · \\d+$/,''),brand:s.brand||'Nieznany',category:s.material||'Inny',color:s.color||'Nie określono',stock:0,unitWeight:+s.initial||1000,unitCost:+s.cost||0,retailPrice:+s.retailPrice||0,lowThreshold:150,createdAt:new Date().toISOString()};groups.set(key,p)}p.stock+=(+s.remaining||0);if(!cn)p.cnId='LEGACY-'+Math.random().toString(36).slice(2,8).toUpperCase();});d.products=[...groups.values()];return d}
function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v)return ensureMeta(Object.assign(blank(),v));let old=JSON.parse(localStorage.getItem(OLD))||JSON.parse(localStorage.getItem(LEGACY));if(old){let d=ensureMeta(migrateLegacy(old));localStorage.setItem(KEY,JSON.stringify(d));return d}}catch(e){console.warn(e)}return blank()}
function save(){ensureMeta(data);data.sync.revision=(+data.sync.revision||0)+1;data.sync.lastLocalChange=new Date().toISOString();data.sync.status='local-only';localStorage.setItem(KEY,JSON.stringify(data));render()}
function fmt(n){return Number(n||0).toLocaleString('pl-PL',{maximumFractionDigits:2})}function money(n){return Number(n||0).toLocaleString('pl-PL',{style:'currency',currency:'PLN'})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateNow(){return new Date().toISOString().slice(0,10)}
function totalKg(){return data.products.reduce((a,p)=>a+Math.max(0,+p.stock||0)*(+p.unitWeight||1000)/1000,0)}
function totalValue(){return data.products.reduce((a,p)=>a+Math.max(0,+p.stock||0)*(+p.unitCost||0),0)}
function revenue(){return data.sales.reduce((a,s)=>a+(+s.revenue||0),0)}
function addHistory(action,p,qty,note='',extra={}){data.history.unshift({id:crypto.randomUUID(),date:new Date().toISOString(),action,productName:p?.name||'—',cnId:p?.cnId||'—',qty,note,...extra})}
function nav(){document.querySelectorAll('.tabs button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.onclick=()=>{tab=b.dataset.tab;render()}})}
function render(){nav();document.getElementById('app').innerHTML=({dashboard,inventory,invoices,sales,catalog,history}[tab]||dashboard)();wire()}
function categoryPie(){let groups={};data.products.forEach(p=>{let q=Math.max(0,+p.stock||0);if(q)groups[p.category||'Inny']=(groups[p.category||'Inny']||0)+q});let entries=Object.entries(groups).sort((a,b)=>b[1]-a[1]),total=entries.reduce((a,e)=>a+e[1],0);if(!total)return `<div class="empty">Brak produktów ze stanem magazynowym do przedstawienia na diagramie.</div>`;let angle=-90,paths=entries.map((e,i)=>{let sweep=e[1]/total*360,a1=angle*Math.PI/180,a2=(angle+sweep)*Math.PI/180,x1=100+85*Math.cos(a1),y1=100+85*Math.sin(a1),x2=100+85*Math.cos(a2),y2=100+85*Math.sin(a2),large=sweep>180?1:0,path=`<path d="M 100 100 L ${x1} ${y1} A 85 85 0 ${large} 1 ${x2} ${y2} Z" fill="hsl(${i*67+24},65%,52%)"/>`;angle+=sweep;return path}).join('');return `<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 200 200" width="220" height="220" role="img" aria-label="Diagram ilości filamentów według kategorii">${paths}</svg><div>${entries.map((e,i)=>`<div style="display:flex;gap:8px;align-items:center;margin:7px 0"><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:hsl(${i*67+24},65%,52%)"></span><span><b>${esc(e[0])}</b> · ${fmt(e[1])} szt. (${fmt(e[1]/total*100)}%)</span></div>`).join('')}<div class="subtle">Podział według liczby sztuk na stanie.</div></div></div>`}
function dashboard(){let low=data.products.filter(p=>p.stock<=p.lowThreshold&&p.stock>0),empty=data.products.filter(p=>p.stock<=0);return `<div class="syncDock"><div id="syncDetails" class="syncDetails"><b>Synchronizacja · tylko lokalnie</b><p>Połączenie z iCloud nie jest aktywne.</p><p>Schemat danych: ${data.schemaVersion||5} · Rewizja: ${data.sync?.revision||0}</p><p>Ostatnia zmiana: ${data.sync?.lastLocalChange?new Date(data.sync.lastLocalChange).toLocaleString('pl-PL'):'Brak'}</p><p>ID urządzenia: ${esc(data.sync?.deviceId||deviceId)}</p></div><button id="syncToggle" class="syncToggle">● Tylko lokalnie · ${data.sync?.revision||0}</button></div><section class="panel"><h2>Struktura magazynu</h2>${categoryPie()}</section><section class="panel"><div class="split"><h2>Alerty magazynowe</h2><button id="addProduct">+ Dodaj filament</button></div>${low.length||empty.length?`<ul>${low.map(p=>`<li><b>${esc(p.name)}</b> · ${esc(p.cnId)} — ${fmt(p.stock)} szt. (próg ${fmt(p.lowThreshold)})</li>`).join('')}${empty.map(p=>`<li><b>${esc(p.name)}</b> · ${esc(p.cnId)} — <span style="color:var(--red)">brak stanu</span></li>`).join('')}</ul>`:`<div class="empty">Brak alertów.</div>`}</section><section class="panel"><div class="split"><h2>Ostatnie operacje</h2><div class="actions"><button class="secondary" id="goInvoices">Zakupy</button><button class="secondary" id="goSales">Sprzedaż / rozchód</button></div></div>${data.history.length?historyTable(data.history.slice(0,6)):`<div class="empty">Brak operacji.</div>`}</section>`}
function productTable(arr){return `<div class="table-wrap"><table><thead><tr><th>Produkt / ID CN</th><th>Materiał / kolor</th><th>Stan</th><th>Koszt zakupu/szt.</th><th>Próg</th><th>Operacje</th></tr></thead><tbody>${arr.map(p=>`<tr><td>${p.image?`<img class="productPhoto" src="${p.image}" alt="${esc(p.name)}">`:``}<b>${esc(p.name)}</b><br><small>ID CN: ${esc(p.cnId)} · ${esc(p.brand)}</small></td><td>${esc(p.category)} · ${esc(p.color)}</td><td>${fmt(p.stock)} szt. <small>(${fmt(p.stock*p.unitWeight)} g)</small></td><td>${money(p.unitCost)}</td><td>${fmt(p.lowThreshold)} szt.</td><td><div class="actions"><button data-operation="${p.id}" ${p.stock<=0?'disabled':''}>Rozchód</button><button class="secondary" data-adjust="${p.id}">Korekta</button><button class="secondary" data-edit="${p.id}">Edytuj</button><button class="danger" data-delete="${p.id}" ${p.stock>0?'disabled title="Najpierw stan musi wynosić 0"':''}>Usuń</button></div></td></tr>`).join('')}</tbody></table></div>`}
function inventory(){let arr=data.products.filter(p=>(p.name+' '+p.cnId+' '+p.brand+' '+p.category+' '+p.color).toLowerCase().includes(filter.toLowerCase()));return `<section class="panel"><h2>Podsumowanie magazynu</h2><div class="grid"><div class="metric"><div class="label">Stan magazynu</div><div class="value">${fmt(totalKg())} kg</div></div><div class="metric"><div class="label">Produkty w ewidencji</div><div class="value">${data.products.length}</div></div><div class="metric"><div class="label">Suma sztuk</div><div class="value">${fmt(data.products.reduce((a,p)=>a+(+p.stock||0),0))}</div></div></div></section><section class="panel"><div class="split"><h2>Magazyn produktów</h2><button id="addProduct">+ Dodaj filament</button></div><input class="search" id="search" placeholder="Szukaj: nazwa, CN, materiał, kolor…" value="${esc(filter)}">${arr.length?productTable(arr):`<div class="empty">Brak produktów.</div>`}</section>`}
function invoices(){return `<section class="panel"><h2>Podsumowanie zakupów</h2><div class="grid"><div class="metric"><div class="label">Wartość aktualnego stanu</div><div class="value">${money(totalValue())}</div></div><div class="metric"><div class="label">Wartość zarejestrowanych zakupów</div><div class="value">${money(data.invoices.reduce((a,i)=>a+(+i.grossTotal||0),0))}</div></div></div></section><section class="panel"><div class="split"><div><h2>Rejestr zakupów</h2><div class="subtle">Zakupy i przyjęcia ilościowe produktów</div></div><button id="addInvoice">+ Zarejestruj zakup</button></div>${data.invoices.length?`<div class="table-wrap"><table><thead><tr><th>Dokument</th><th>Dostawca</th><th>Data</th><th>Pozycje</th><th>Wartość</th><th>Status</th></tr></thead><tbody>${data.invoices.slice().reverse().map(i=>`<tr><td><b>${esc(i.number)}</b></td><td>${esc(i.supplierName)}<br><small>${esc(i.nip||'—')}</small></td><td>${esc(i.purchaseDate)}</td><td>${i.items.length}</td><td>${money(i.grossTotal)}</td><td><span class="pill open">Przyjęto</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nie zarejestrowano zakupów.</div>`}</section><section class="panel"><h2>Dostawcy (${data.suppliers.length})</h2>${data.suppliers.length?data.suppliers.map(s=>`<p>${esc(s.name)} · ${esc(s.nip||'—')}</p>`).join(''):`<div class="empty">Dostawcy będą zapisywani podczas rejestracji zakupów.</div>`}</section>`}
function sales(){return `<section class="panel"><div class="split"><div><h2>Sprzedaż / rozchód</h2><div class="subtle">Rozchód zmniejsza ilość produktu; zapisujemy przychód lub powód.</div></div><button id="addSale" ${data.products.some(p=>p.stock>0)?'':'disabled'}>+ Operacja</button></div><div class="grid"><div class="metric"><div class="label">Przychód łącznie</div><div class="value">${money(revenue())}</div></div><div class="metric"><div class="label">Transakcje</div><div class="value">${data.sales.length}</div></div><div class="metric"><div class="label">Rozchodowana masa</div><div class="value">${fmt(data.sales.reduce((a,s)=>a+(+s.qty||0)*(+s.unitWeight||1000),0))} g</div></div></div>${data.sales.length?`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Dokument</th><th>Klient</th><th>Produkt</th><th>Ilość</th><th>Cena / szt.</th><th>Przychód</th></tr></thead><tbody>${data.sales.slice().reverse().map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(s.document||'—')}</td><td>${esc(s.customer||'—')}</td><td>${esc(s.productName)}</td><td>${fmt(s.qty)} szt.</td><td>${money(s.pricePerUnit)}</td><td><b>${money(s.revenue)}</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Brak operacji.</div>`}</section><div class="notice">Rozchód wewnętrzny nie generuje przychodu. Sprzedaż zapisuje cenę i przychód; koszt materiału jest ewidencjonowany oddzielnie.</div>`}
function catalog(){return `<section class="panel"><h2>Katalog</h2><p class="subtle">Produkty z ewidencji magazynowej.</p>${data.products.length?productTable(data.products):`<div class="empty">Katalog jest pusty.</div>`}</section><section class="panel"><h2>Kategorie materiałów</h2><div class="split"><input id="newCategory" placeholder="Nowa kategoria" style="max-width:400px"><button id="addCategory">Dodaj kategorię</button></div><div class="actions">${data.categories.map(c=>`<span class="pill">${esc(c)}</span>`).join(' ')}</div></section>`}
function historyTable(rows){return `<div class="table-wrap"><table><thead><tr><th>Data</th><th>Operacja</th><th>Produkt / CN</th><th>Ilość</th><th>Szczegóły</th></tr></thead><tbody>${rows.map(h=>`<tr><td>${new Date(h.date).toLocaleString('pl-PL')}</td><td>${esc(h.action)}</td><td>${esc(h.productName)}<br><small>${esc(h.cnId||'')}</small></td><td>${h.qty==null?'—':fmt(h.qty)+' szt.'}</td><td>${esc(h.note||'')}</td></tr>`).join('')}</tbody></table></div>`}
function history(){return `<section class="panel"><h2>Historia operacji</h2>${data.history.length?historyTable(data.history):`<div class="empty">Historia jest pusta.</div>`}</section>`}
function modal(title,body,onSave,wide=false){document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="dialog" style="${wide?'max-width:1000px':''}"><h2>${title}</h2>${body}<footer><button class="secondary" id="cancel">Anuluj</button><button id="save">Zapisz</button></footer></div></div>`;document.getElementById('cancel').onclick=closeModal;document.getElementById('save').onclick=onSave}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function productForm(id){let p=data.products.find(x=>x.id===id);let body=`<form id="productForm"><div class="field full"><label>Zdjęcie produktu</label><input name="imageFile" type="file" accept="image/*"><img id="productPhotoPreview" class="photoPreview ${p?.image?'':'hide'}" src="${p?.image||''}" alt="Podgląd zdjęcia"><button type="button" class="secondary" id="removePhoto" ${p?.image?'':'disabled'}>Usuń zdjęcie</button><p class="small">Zdjęcie zapisuje się lokalnie przy produkcie. Zalecane zdjęcia niewielkich rozmiarów.</p></div><div class="formgrid"><div><label>ID CN / kod unikalny *</label><input name="cn" required value="${esc(p?.cnId||'')}"></div><div><label>Nazwa produktu *</label><input name="name" required value="${esc(p?.name||'')}"></div><div><label>Producent</label><input name="brand" value="${esc(p?.brand||'')}"></div><div><label>Kategoria *</label><select name="category">${data.categories.map(c=>`<option ${p?.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div><label>Kolor</label><input name="color" value="${esc(p?.color||'')}"></div><div><label>Masa jednej sztuki (g)</label><input name="weight" type="number" min="1" value="${p?.unitWeight||1000}"></div><div><label>Koszt zakupu/szt. (PLN)</label><input name="cost" type="number" min="0" step=".01" value="${p?.unitCost||0}"></div><div><label>Cena sprzedaży/szt. (PLN)</label><input name="retail" type="number" min="0" step=".01" value="${p?.retailPrice||0}"></div><div><label>Stan (szt.)</label><input name="stock" type="number" min="0" step=".01" value="${p?.stock||0}" ${p?'disabled':''}></div><div><label>Alert przy stanie (szt.)</label><input name="low" type="number" min="0" value="${p?.lowThreshold||1}"></div></div>${p?'<p class="small">Stan zmieniaj przez operację magazynową, nie przez edycję produktu.</p>':''}</form>`;modal(p?'Edytuj produkt':'Dodaj filament',body,()=>{let f=document.getElementById('productForm');if(!f.reportValidity())return;let x=new FormData(f),cn=x.get('cn').trim();let imgFile=f.elements.imageFile.files[0];let applyProductSave=(imageVal)=>{if(data.products.some(q=>q.cnId===cn&&q.id!==p?.id))return alert('Ten ID CN już istnieje.');if(p){Object.assign(p,{cnId:cn,name:x.get('name').trim(),brand:x.get('brand'),category:x.get('category'),color:x.get('color'),unitWeight:+x.get('weight'),unitCost:+x.get('cost'),retailPrice:+x.get('retail'),lowThreshold:+x.get('low'),image:imageVal})}else{let q={id:crypto.randomUUID(),cnId:cn,name:x.get('name').trim(),brand:x.get('brand')||'Nieznany',category:x.get('category'),color:x.get('color')||'Nie określono',unitWeight:+x.get('weight')||1000,unitCost:+x.get('cost')||0,retailPrice:+x.get('retail')||0,stock:+x.get('stock')||0,lowThreshold:+x.get('low')||1,image:imageVal||'',createdAt:new Date().toISOString()};data.products.push(q);if(q.stock)addHistory('Stan początkowy',q,q.stock,'Wprowadzenie początkowego stanu')}closeModal();save()};if(imgFile){if(imgFile.size>1500000)return alert('Zdjęcie jest zbyt duże (limit 1,5 MB). Zmniejsz je przed dodaniem.');let rd=new FileReader();rd.onload=()=>applyProductSave(rd.result);rd.readAsDataURL(imgFile)}else applyProductSave(photoInput?.dataset.remove==='1'?'':(p?.image||''))});let photoInput=document.querySelector('#productForm [name=imageFile]'),preview=document.getElementById('productPhotoPreview'),removeBtn=document.getElementById('removePhoto');photoInput.onchange=()=>{let f=photoInput.files[0];if(!f)return;if(f.size>1500000){alert('Zdjęcie jest zbyt duże (limit 1,5 MB).');photoInput.value='';return}let rd=new FileReader();rd.onload=()=>{preview.src=rd.result;preview.classList.remove('hide');removeBtn.disabled=false;photoInput.dataset.remove='0'};rd.readAsDataURL(f)};removeBtn.onclick=()=>{preview.src='';preview.classList.add('hide');removeBtn.disabled=true;photoInput.dataset.remove='1';photoInput.value=''};}
function operationForm(id,kind='adjustment'){let p=data.products.find(q=>q.id===id);if(!p)return;modal(kind==='adjustment'?'Korekta stanu':'Rozchód',`<form id="opForm"><div class="notice">${esc(p.name)} · ${esc(p.cnId)} · stan: ${fmt(p.stock)} szt.</div><div class="formgrid"><div><label>Typ operacji</label><select name="type"><option value="consumption">Zużycie własne</option><option value="sale">Sprzedaż</option><option value="adjustment">Korekta (+/-)</option></select></div><div><label>Ilość (szt.)</label><input name="qty" type="number" step=".01" required></div><div><label>Cena sprzedaży/szt. (PLN; sprzedaż)</label><input name="price" type="number" step=".01" min="0" value="${p.retailPrice||0}"></div><div><label>Dokument / klient</label><input name="doc"></div><div class="field full"><label>Uwagi / powód</label><input name="note"></div></div><p class="small">Korekta: wpisz wartość dodatnią, aby zwiększyć stan, lub ujemną, aby go zmniejszyć.</p></form>`,()=>{let f=document.getElementById('opForm');if(!f.reportValidity())return;let x=new FormData(f),type=x.get('type'),q=+x.get('qty');if(type==='adjustment'&&q===0)return alert('Korekta nie może wynosić zero.');if(type!=='adjustment'&&q<=0)return alert('Ilość musi być dodatnia.');if(type==='adjustment'){if(p.stock+q<0)return alert('Korekta przekracza stan.');p.stock+=q;addHistory('Korekta',p,q,x.get('note'))}else{if(q>p.stock)return alert('Brak wystarczającego stanu.');p.stock-=q;if(type==='sale'){let price=+x.get('price')||0,sale={id:crypto.randomUUID(),productId:p.id,productCN:p.cnId,productName:p.name,qty:q,unitWeight:p.unitWeight,pricePerUnit:price,revenue:q*price,date:dateNow(),document:x.get('doc'),customer:'',note:x.get('note'),costAtSale:q*p.unitCost};data.sales.push(sale);addHistory('Sprzedaż',p,-q,`${x.get('doc')} · przychód ${money(sale.revenue)}`)}else addHistory('Zużycie własne',p,-q,x.get('note'))}closeModal();save()})}

function saleChoiceForm(){let available=data.products.filter(p=>p.stock>0);if(!available.length)return;modal('Wybierz produkt do sprzedaży',`<form id="saleChoice"><label>Produkt *</label><select name="product" required>${available.map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(p.cnId)} · stan ${fmt(p.stock)}</option>`).join('')}</select></form>`,()=>{let id=document.getElementById('saleChoice').elements.product.value;closeModal();operationForm(id,'sale')})}
function invoiceForm(){let row=()=>`<tr><td><input name="cn" placeholder="ID CN" required></td><td><input name="name" placeholder="Nazwa" required></td><td><select name="category">${data.categories.map(c=>`<option value="${esc(c)}" ${c==='PLA'?'selected':''}>${esc(c)}</option>`).join('')}</select></td><td><input name="color" placeholder="Kolor"></td><td><input name="qty" type="number" step=".01" min=".01" value="1" required></td><td><input name="weight" type="number" min="1" value="1000"></td><td><input name="cost" type="number" min="0" step=".01" value="0"></td><td><input name="retail" type="number" min="0" step=".01" value="0"></td><td><input name="photo" type="file" accept="image/*"></td><td><button type="button" class="danger removeRow">×</button></td></tr>`;let body=`<form id="invoiceForm"><div class="formgrid"><div><label>Dostawca *</label><input name="supplier" required></div><div><label>NIP</label><input name="nip"></div><div><label>Numer dokumentu *</label><input name="number" required></div><div><label>Data zakupu</label><input name="date" type="date" value="${dateNow()}"></div><div><label>Koszt dostawy</label><input name="shipping" type="number" step=".01" value="0"></div><div class="field full"><label>Uwagi</label><textarea name="notes"></textarea></div></div><div class="split"><h3>Pozycje zakupu</h3><button type="button" class="secondary" id="addLine">+ Pozycja</button></div><div class="table-wrap"><table><thead><tr><th>CN</th><th>Nazwa</th><th>Materiał</th><th>Kolor</th><th>Ilość</th><th>Masa/szt. (g)</th><th>Koszt/szt.</th><th>Detal/szt.</th><th>Zdjęcie</th><th></th></tr></thead><tbody id="rows">${row()}</tbody></table></div></form>`;modal('Rejestruj zakup',body,()=>{let f=document.getElementById('invoiceForm');if(!f.reportValidity())return;let x=new FormData(f),rows=[...document.querySelectorAll('#rows tr')].map(tr=>{let v=n=>tr.querySelector(`[name=${n}]`).value;return{cn:v('cn').trim(),name:v('name').trim(),category:v('category')||'Inny',color:v('color'),qty:+v('qty'),weight:+v('weight'),cost:+v('cost'),retail:+v('retail'),photoFile:tr.querySelector('[name=photo]').files[0]||null}});if(rows.some(r=>r.qty<=0||!r.cn||!r.name))return alert('Sprawdź pozycje.');if(rows.some(r=>r.photoFile&&r.photoFile.size>1500000))return alert('Zdjęcie w pozycji zakupu przekracza limit 1,5 MB.');Promise.all(rows.map(r=>r.photoFile?new Promise(resolve=>{let rd=new FileReader();rd.onload=()=>{r.image=rd.result;resolve()};rd.readAsDataURL(r.photoFile)}):Promise.resolve())).then(()=>{let supplier=data.suppliers.find(s=>x.get('nip')&&s.nip===x.get('nip'));if(!supplier){supplier={id:crypto.randomUUID(),name:x.get('supplier'),nip:x.get('nip'),address:''};data.suppliers.push(supplier)}else supplier.name=x.get('supplier');let invoice={id:crypto.randomUUID(),supplierName:x.get('supplier'),nip:x.get('nip'),number:x.get('number'),purchaseDate:x.get('date'),items:rows,shipping:+x.get('shipping')||0,notes:x.get('notes'),grossTotal:rows.reduce((sum,r)=>sum+r.qty*r.cost,0)+(+x.get('shipping')||0),created:new Date().toISOString()};data.invoices.push(invoice);rows.forEach(r=>{delete r.photoFile;let p=data.products.find(p=>p.cnId===r.cn);if(!p){p={id:crypto.randomUUID(),cnId:r.cn,name:r.name,brand:x.get('supplier'),category:r.category,color:r.color||'Nie określono',unitWeight:r.weight,unitCost:r.cost,retailPrice:r.retail,image:r.image||'',stock:0,lowThreshold:1,createdAt:new Date().toISOString()};data.products.push(p)}else{p.name=r.name;p.category=r.category;p.color=r.color;p.unitWeight=r.weight;if(r.cost)p.unitCost=r.cost;if(r.retail)p.retailPrice=r.retail;if(r.image)p.image=r.image}p.stock+=r.qty;addHistory('Przyjęcie zakupu',p,r.qty,`${invoice.number} · ${invoice.supplierName}`)});closeModal();save();alert('Zakup zapisany, stan magazynu zaktualizowany.')});},true);document.getElementById('addLine').onclick=()=>document.getElementById('rows').insertAdjacentHTML('beforeend',row());document.getElementById('rows').onclick=e=>{if(e.target.classList.contains('removeRow')){if(document.querySelectorAll('#rows tr').length>1)e.target.closest('tr').remove();else alert('Dokument musi zawierać pozycję.')}}}
function wire(){document.getElementById('syncToggle')?.addEventListener('click',()=>document.getElementById('syncDetails')?.classList.toggle('show'));document.getElementById('addProduct')?.addEventListener('click',()=>productForm());document.getElementById('addInvoice')?.addEventListener('click',invoiceForm);document.getElementById('addSale')?.addEventListener('click',saleChoiceForm);document.getElementById('goInvoices')?.addEventListener('click',()=>{tab='invoices';render()});document.getElementById('goSales')?.addEventListener('click',()=>{tab='sales';render()});let search=document.getElementById('search');if(search)search.oninput=e=>{filter=e.target.value;let pos=e.target.selectionStart;render();let n=document.getElementById('search');n.focus();n.setSelectionRange(pos,pos)};document.querySelectorAll('[data-operation]').forEach(b=>b.onclick=()=>operationForm(b.dataset.operation,'consumption'));document.querySelectorAll('[data-adjust]').forEach(b=>b.onclick=()=>operationForm(b.dataset.adjust,'adjustment'));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>productForm(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.delete));document.getElementById('addCategory')?.addEventListener('click',()=>{let c=document.getElementById('newCategory').value.trim();if(c&&!data.categories.includes(c)){data.categories.push(c);save()}else if(!c)alert('Wpisz nazwę kategorii.')})}
function exportData(){let blob=new Blob([JSON.stringify({version:5,app:'Flywooki Studio',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='flywooki-studio-backup-'+dateNow()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function deleteProduct(id){let p=data.products.find(q=>q.id===id);if(!p)return;if(p.stock>0)return alert('Nie można usunąć produktu ze stanem większym niż 0. Najpierw wykonaj operację magazynową.');if(!confirm(`Usunąć produkt „${p.name}” (${p.cnId})? Historia operacji pozostanie zachowana.`))return;addHistory('Usunięcie produktu',p,0,'Produkt usunięty z ewidencji; wcześniejsza historia pozostaje.');data.products=data.products.filter(q=>q.id!==id);save()}
function wireExport(){document.getElementById('exportBtn').onclick=exportData;document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();document.getElementById('fileInput').onchange=e=>{let file=e.target.files[0];if(!file)return;let rd=new FileReader();rd.onload=()=>{try{let v=JSON.parse(rd.result),d=v.data||v;if(!Array.isArray(d.products)&&!Array.isArray(d.spools))throw Error('Nieprawidłowy plik');if(!confirm('Import zastąpi aktualne dane. Najpierw wykonaj eksport kopii. Kontynuować?'))return;if(d.spools)d=migrateLegacy(d);data=ensureMeta(Object.assign(blank(),d));save();alert('Import zakończony.')}catch(err){alert('Import nieudany: '+err.message)}};rd.readAsText(file);e.target.value=''}}
wireExport();render();
const sbPanel=document.getElementById('sbPanel');document.getElementById('supabaseBtn').onclick=()=>{sbPanel.classList.remove('hide');document.getElementById('sbUrl').value=sessionStorage.getItem('fsm_sb_url')||'';document.getElementById('sbKey').value=sessionStorage.getItem('fsm_sb_key')||''};document.getElementById('sbClose').onclick=()=>sbPanel.classList.add('hide');
const APP_REDIRECT='https://7rzbrwgt6c-a11y.github.io/flywooki-studio/';
async function verifyCloudSession(accessToken){let url=sessionStorage.getItem('fsm_sb_url'),key=sessionStorage.getItem('fsm_sb_key'),out=document.getElementById('sbResult');sessionStorage.setItem('fsm_sb_access_token',accessToken);out.textContent='Sesja OAuth odebrana. Sprawdzam odczyt schemy fsm…';try{let vr=await fetch(url+'/rest/v1/stock_balance?select=product_id&limit=1',{headers:{apikey:key,Authorization:'Bearer '+accessToken,'Accept-Profile':'fsm','Content-Profile':'fsm'}});let detail=await vr.text();out.textContent=vr.ok?'Logowanie GitHub OK. Dostęp do schemy fsm/stock_balance działa (HTTP '+vr.status+').':'Zalogowano przez GitHub, ale odczyt fsm zwrócił HTTP '+vr.status+'. '+detail.slice(0,220)}catch(e){out.textContent='Sesja odebrana, ale test odczytu nie powiódł się: '+e.message}}
async function consumeOAuthCode(code){let url=sessionStorage.getItem('fsm_sb_url'),key=sessionStorage.getItem('fsm_sb_key'),verifier=sessionStorage.getItem('fsm_sb_code_verifier'),out=document.getElementById('sbResult');if(!url||!key||!verifier){out.textContent='Brakuje danych sesji testowej. Uruchom logowanie ponownie.';return}out.textContent='Odbieram sesję OAuth (PKCE)…';try{let r=await fetch(url+'/auth/v1/token?grant_type=pkce',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({auth_code:code,code_verifier:verifier})});let j=await r.json();if(!r.ok||!j.access_token){out.textContent='Nie udało się odebrać sesji OAuth (HTTP '+r.status+'): '+(j.msg||j.message||j.error_description||j.error||'');return}sessionStorage.removeItem('fsm_sb_code_verifier');history.replaceState(null,'',location.pathname+location.search);sbPanel.classList.remove('hide');await verifyCloudSession(j.access_token)}catch(e){out.textContent='Błąd odbierania sesji: '+e.message}}
// OAuth return handler for Supabase PKCE code.
if(location.search.includes('code=')){let params=new URLSearchParams(location.search);let code=params.get('code');if(code)consumeOAuthCode(code)}
// Also handle legacy implicit-flow token returns, if supplied.
if(location.hash.includes('access_token=')){let params=new URLSearchParams(location.hash.slice(1));let token=params.get('access_token');let url=sessionStorage.getItem('fsm_sb_url'),key=sessionStorage.getItem('fsm_sb_key');if(token&&url&&key){history.replaceState(null,'',location.pathname+location.search);sbPanel.classList.remove('hide');verifyCloudSession(token)}}
document.getElementById('sbGithub').onclick=async()=>{let url=document.getElementById('sbUrl').value.trim().replace(/\/$/,''),key=document.getElementById('sbKey').value.trim(),out=document.getElementById('sbResult');if(!/^https:\/\/[^ ]+\.supabase\.co$/.test(url)||!key.startsWith('sb_publishable_')){out.textContent='Sprawdź Project URL oraz Publishable key.';return}sessionStorage.setItem('fsm_sb_url',url);sessionStorage.setItem('fsm_sb_key',key);out.textContent='Przygotowuję bezpieczne logowanie…';try{let verifier=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');sessionStorage.setItem('fsm_sb_code_verifier',verifier);let digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));let challenge= btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');let redirect=encodeURIComponent(APP_REDIRECT);location.href=url+'/auth/v1/authorize?provider=github&apikey='+encodeURIComponent(key)+'&redirect_to='+redirect+'&code_challenge='+encodeURIComponent(challenge)+'&code_challenge_method=s256'}catch(e){out.textContent='Nie można przygotować OAuth PKCE: '+e.message}};
document.getElementById('installHelpBtn').onclick=()=>alert('Instalacja iPhone/iPad: Safari → Udostępnij → Dodaj do ekranu początkowego.');if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
